<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小旅帳" />
  <title>小旅帳 · 可愛旅行記帳</title>
  <style>
    :root {
      --bg: #fff9f5;
      --card: #ffffff;
      --text: #4a3b36;
      --muted: #9c867e;
      --pink: #ff8fa3;
      --pink-soft: #ffe5ec;
      --mint: #48b89b;
      --mint-soft: #e6f7f2;
      --peach: #ffb38a;
      --peach-soft: #fff0e6;
      --border: #f3e4dc;
      --shadow: 0 6px 18px rgba(235, 165, 155, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 56px;
    }
    header {
      background: linear-gradient(135deg, #ffe5ec 0%, #fff0e6 100%);
      padding: calc(env(safe-area-inset-top) + 14px) 16px 18px;
      border-bottom: 1.5px solid var(--border);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .trip-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .trip-picker select {
      flex: 1;
      min-width: 0;
      background: #fff;
      border: 1.5px solid #ffd1dc;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .pill-btn {
      background: #fff;
      border: 1.5px solid #ffd1dc;
      color: var(--text);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .sum-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 9px 8px;
      text-align: center;
    }
    .sum-box span { display: block; font-size: 11px; color: var(--muted); }
    .sum-box strong { display: block; font-size: 14px; margin-top: 2px; }
    .container { max-width: 520px; margin: 0 auto; padding: 12px; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      padding: 10px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--pink);
      border-color: var(--pink);
      color: #fff;
    }
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .type-btn {
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #fffaf7;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
    }
    .type-btn.active.expense { background: var(--pink-soft); border-color: var(--pink); color: #d64566; }
    .type-btn.active.income { background: var(--mint-soft); border-color: var(--mint); color: #1f8a6e; }
    .amount-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cur-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fffaf7;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0 12px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .amt-input {
      flex: 1;
      min-width: 0;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 21px;
      font-weight: 800;
      color: var(--text);
      background: #fff;
    }
    .hkd-preview {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .cat-btn {
      padding: 10px 6px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #fffaf7;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-btn.selected {
      background: var(--peach-soft);
      border-color: var(--peach);
      color: #b85d2b;
      font-weight: 700;
    }
    .split-box {
      background: #fffaf7;
      border: 1.5px dashed #f0d7cb;
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .split-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .split-line select {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 5px 8px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip.on {
      background: var(--pink-soft);
      border-color: var(--pink);
      color: #c93b5c;
    }
    .extra-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .extra-row input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 9px 10px;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }
    .save-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff8fa3 0%, #ffa69e 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 143, 163, 0.35);
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px dashed var(--border);
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-left strong { display: block; font-size: 14px; }
    .tx-left small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-right { text-align: right; }
    .tx-right .orig { display: block; font-weight: 800; font-size: 14px; }
    .tx-right .hkd { display: block; font-size: 11px; color: var(--muted); }
    .del-btn {
      margin-left: 8px;
      background: none;
      border: none;
      color: #c7b2ab;
      font-size: 15px;
      cursor: pointer;
    }
    .settle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #f7ebe4;
      font-size: 13px;
    }
    .settle-row:last-child { border-bottom: none; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 59, 54, 0.35);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 22px;
      padding: 16px;
      max-height: 85vh;
      overflow
